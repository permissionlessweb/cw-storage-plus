[workspace]
members = [".", "macros"]

resolver = "2"

[package]
name = "cw-storage-plus"
version = "3.0.1"
authors = ["Ethan Frey <ethanfrey@users.noreply.github.com>"]
edition = "2021"
description = "Enhanced storage engines"
license = "Apache-2.0"
repository = "https://github.com/CosmWasm/cw-storage-plus"
homepage = "https://cosmwasm.com"

[package.metadata.docs.rs]
all-features = true # include macro feature when building docs

[features]
default = ["iterator"]
iterator = ["cosmwasm-std/iterator"]
macro = ["dep:cw-storage-macro"]

[lib]
# See https://bheisler.github.io/criterion.rs/book/faq.html#cargo-bench-gives-unrecognized-option-errors-for-valid-command-line-options
bench = false

[dependencies]
cosmwasm-std = { git = "ssh://returniflost@groot-wan/Users/returniflost/abstract/terp-core/crates/cosmwasm", branch = "v3.1.0-zk.0", package = "cosmwasm-std", default-features = false, features = ["std"] }
schemars = "0.8.22"
serde = { version = "1.0", default-features = false, features = ["derive"] }
cw-storage-macro = { path = "macros", version = "3.0.1", optional = true }

[dev-dependencies]
# See https://bheisler.github.io/criterion.rs/book/user_guide/command_line_options.html for using baselines
criterion = { version = "0.7.0", features = ["html_reports"] }
rand = { version = "0.9.1", default-features = false }
rand_xoshiro = { version = "0.7.0", default-features = false }
derive_more = { version = "2.0.1", features = ["full"] }

[[bench]]
name = "main"
harness = false

[patch.'https://github.com/permissionlessweb/cosmos-rust']
cosmos-sdk-proto = { git = "ssh://returniflost@groot-wan/Users/returniflost/abstract/terp-core/crates/cosmos-rust", branch = "v3.1.0-zk.0", package = "cosmos-sdk-proto" }
cosmrs = { git = "ssh://returniflost@groot-wan/Users/returniflost/abstract/terp-core/crates/cosmos-rust", branch = "v3.1.0-zk.0", package = "cosmrs" }

[patch.'https://github.com/permissionlessweb/tendermint-rs']
tendermint = { git = "ssh://returniflost@groot-wan/Users/returniflost/abstract/terp-core/crates/tendermint-rs", branch = "v3.1.0-zk.0", package = "tendermint" }
tendermint-abci = { path = "../tendermint-rs/abci" }
tendermint-config = { path = "../tendermint-rs/config" }
tendermint-light-client = { path = "../tendermint-rs/light-client" }
tendermint-light-client-detector = { path = "../tendermint-rs/light-client-detector" }
tendermint-light-client-verifier = { path = "../tendermint-rs/light-client-verifier" }
tendermint-proto = { git = "ssh://returniflost@groot-wan/Users/returniflost/abstract/terp-core/crates/tendermint-rs", branch = "v3.1.0-zk.0", package = "tendermint-proto" }
tendermint-rpc = { git = "ssh://returniflost@groot-wan/Users/returniflost/abstract/terp-core/crates/tendermint-rs", branch = "v3.1.0-zk.0", package = "tendermint-rpc" }
tendermint-testgen = { path = "../tendermint-rs/testgen" }
